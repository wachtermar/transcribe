name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compile
        run: uv run python -m py_compile transcribe.py
      - name: Test deterministic helpers
        run: uv run python -m unittest discover -s tests -v
      - name: Lint
        run: uvx ruff check transcribe.py tests
